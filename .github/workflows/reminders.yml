name: Task reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder check
        run: |
          response=$(curl -s -w "\n%{http_code}" -X GET "https://planner-vmdv-eight.vercel.app/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          echo "HTTP status: $status"
          echo "Response body: $body"
          if [ "$status" -ne 200 ]; then
            exit 1
          fi
